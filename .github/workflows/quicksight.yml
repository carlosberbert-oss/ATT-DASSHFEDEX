name: Exportar QuickSight para Dash_fedex

on:
  # O agendamento é feito por fora, no cron-job.org, que chama a API do
  # GitHub nos horários (08h e 18h, dias úteis). Por isso não há bloco
  # "schedule" aqui — ter os dois faria o workflow rodar em duplicidade.
  # O workflow_dispatch é o que permite tanto o disparo externo quanto
  # o botão "Run workflow" na aba Actions.
  workflow_dispatch:

jobs:
  exportar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Exportar e atualizar planilha
        env:
          QS_ACCOUNT: advanceanalytics
          QS_USER: ${{ secrets.QS_USER }}
          QS_PASSWORD: ${{ secrets.QS_PASSWORD }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
        run: python scripts/quicksight_export.py

      # Se falhar, guarda screenshot e HTML pra descobrir o que mudou
      - name: Guardar evidências em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_number }}
          path: debug/
          retention-days: 14
