name: Atualizar PEDIDOS ENTREGUES (BASE)

on:
  # Disparo externo pelo cron-job.org, TODO DIA às 12h (inclusive sábado e
  # domingo), igual ao bot do QuickSight. Sem bloco "schedule" para não rodar
  # em duplicidade. O workflow_dispatch também libera o botão "Run workflow".
  workflow_dispatch:
    inputs:
      modo:
        description: "O que fazer"
        type: choice
        options:
          - entregas do dia
          - completar valores (histórico)
          - completar coordenadas (histórico)
        default: entregas do dia
      data:
        description: "Entregas do dia: dia a processar (AAAA-MM-DD). Vazio = ontem"
        required: false
        default: ""
      desde:
        description: "Completar: a partir de (AAAA-MM-DD). Vazio = últimos 90 dias"
        required: false
        default: ""
      ate:
        description: "Completar: até (AAAA-MM-DD). Vazio = hoje"
        required: false
        default: ""

jobs:
  entregues:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Rodar
        env:
          QS_ACCOUNT: advanceanalytics
          QS_USER: ${{ secrets.QS_USER }}
          QS_PASSWORD: ${{ secrets.QS_PASSWORD }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
          ZECORE_USER: ${{ secrets.ZECORE_USER }}
          ZECORE_PASSWORD: ${{ secrets.ZECORE_PASSWORD }}
          JAMEF_API_USER: ${{ secrets.JAMEF_API_USER }}
          JAMEF_API_PASS: ${{ secrets.JAMEF_API_PASS }}
          MODO: ${{ github.event.inputs.modo }}
          DATA: ${{ github.event.inputs.data }}
          DESDE: ${{ github.event.inputs.desde }}
          ATE: ${{ github.event.inputs.ate }}
        run: |
          if [ "$MODO" = "completar coordenadas (histórico)" ]; then
            ARGS="--completar-coordenadas --tempo-max 28"
            [ -n "$DESDE" ] && ARGS="$ARGS --desde $DESDE"
            [ -n "$ATE" ] && ARGS="$ARGS --ate $ATE"
            python scripts/entregues_export.py $ARGS
          elif [ "$MODO" = "completar valores (histórico)" ]; then
            ARGS="--completar-valores --tempo-max 28"
            [ -n "$DESDE" ] && ARGS="$ARGS --desde $DESDE"
            [ -n "$ATE" ] && ARGS="$ARGS --ate $ATE"
            python scripts/entregues_export.py $ARGS
          elif [ -n "$DATA" ]; then
            python scripts/entregues_export.py --data "$DATA"
          else
            python scripts/entregues_export.py
          fi

      - name: Guardar evidências em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-entregues-${{ github.run_number }}
          path: |
            debug/
            saida/
          retention-days: 14
